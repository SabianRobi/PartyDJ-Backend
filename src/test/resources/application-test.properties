# General
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
app.frontend.url=http://localhost:3000
app.backend.url=http://localhost:8080

# Database
spring.datasource.driverClassName=org.hsqldb.jdbc.JDBCDriver
spring.datasource.url=jdbc:hsqldb:mem:PartyDJBackendTest
spring.datasource.username=SA
spring.datasource.password=

# Spotify
app.platforms.spotify.client-id=test-spotify-client-id
app.platforms.spotify.client-secret=test-spotify-client-secret
app.platforms.spotify.redirect-uri=http://localhost:3000/auth/login/spotify/callback
app.platforms.spotify.scopes=streaming

# Google
app.platforms.google.client-id=test-google-client-id
app.platforms.google.client-secret=test-google-client-secret
app.platforms.google.redirect-uri=http://localhost:3000/auth/login/google/callback

# Debug
app.debug=false
