# General
spring.application.name=PartyDJ-Backend
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.config.import=optional:file:.env[.properties]
app.frontend.url=${FRONTEND_URL}
app.backend.url=${BACKEND_URL}

# Database
jakarta.persistence.jdbc.url=${DB_URL}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# Actuator
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/api/v1/actuator

# Spotify
app.platforms.spotify.client-id=${SPOTIFY_CLIENT_ID}
app.platforms.spotify.client-secret=${SPOTIFY_CLIENT_SECRET}
app.platforms.spotify.redirect-uri=${app.frontend.url}/auth/login/spotify/callback
app.platforms.spotify.scopes=streaming, user-modify-playback-state, user-read-currently-playing, user-read-playback-state

# Google
app.platforms.google.client-id=${GOOGLE_CLIENT_ID}
app.platforms.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.platforms.google.redirect-uri=${app.frontend.url}/auth/login/google/callback
app.platforms.google.scopes=userinfo.email,userinfo.profile,openid,youtube.readonly

# Debug
app.debug=${DEBUG}
