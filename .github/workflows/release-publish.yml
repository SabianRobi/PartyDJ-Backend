name: Release and Publish Docker Image

on:
  workflow_run:
    workflows: [ "Bump Version" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  actions: read
  contents: write

jobs:
  release-metadata:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      should_release: ${{ steps.metadata.outputs.should_release }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read release metadata
        id: metadata
        run: |
          cat release-metadata.txt >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: release-metadata
    if: needs.release-metadata.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build application
        run: mvn -B -DskipTests package --file pom.xml
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            sabianrobi/partydj:latest
            sabianrobi/partydj:${{ needs.release-metadata.outputs.version }}
