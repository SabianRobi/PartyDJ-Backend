name: Release and Publish Docker Image

on:
  workflow_run:
    workflows: [ "Bump Version" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  actions: read
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Check whether the version changed
        id: version
        env:
          BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def project_version(pom):
              root = ET.fromstring(pom)
              version = root.find("{*}version")
              if version is None or not version.text:
                  raise SystemExit("Could not find the project version in pom.xml")
              return version.text.strip()

          previous_pom = subprocess.run(
              ["git", "show", f"{os.environ['BASE_SHA']}:pom.xml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          previous_version = project_version(previous_pom)
          current_version = project_version(Path("pom.xml").read_text())

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={current_version}\n")
              output.write(
                  f"changed={'true' if current_version != previous_version else 'false'}\n"
              )
          PY

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn -B -DskipTests package --file pom.xml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            sabianrobi/partydj:latest
            sabianrobi/partydj:${{ needs.check-version.outputs.version }}
