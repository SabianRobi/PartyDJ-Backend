name: Bump Version

on:
  workflow_run:
    workflows: [ "Build & Test" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  actions: read
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine new version
        id: version
        env:
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import re
          from pathlib import Path

          pom_path = Path("pom.xml")
          pom = pom_path.read_text()
          match = re.search(
              r"(<artifactId>PartyDJ</artifactId>\s*<version>)([^<]+)(</version>)",
              pom,
          )
          if match is None:
              raise SystemExit("Could not find the PartyDJ project version in pom.xml")

          current = match.group(2).strip().removeprefix("v")
          version_match = re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", current)
          if version_match is None:
              raise SystemExit(f"Unsupported project version: {current}")
          major, minor, patch = map(int, version_match.groups())

          bump_levels = {"none": 0, "patch": 1, "minor": 2, "major": 3}
          bump = "none"
          commits = json.loads(os.environ["PUSH_COMMITS"])
          for commit in commits:
              message = commit.get("message", "")
              header = message.splitlines()[0] if message else ""
              conventional = re.match(
                  r"^(?P<type>[a-zA-Z][\w-]*)(?:\([^)\r\n]+\))?(?P<breaking>!)?:",
                  header,
              )
              level = "none"
              if re.search(r"BREAKING[- ]CHANGE:", message, re.IGNORECASE) or (
                  conventional and conventional.group("breaking")
              ):
                  level = "major"
              elif conventional:
                  commit_type = conventional.group("type").lower()
                  if commit_type in {"feat", "minor"}:
                      level = "minor"
                  elif commit_type in {"fix", "perf", "revert", "patch"}:
                      level = "patch"
                  elif commit_type == "major":
                      level = "major"
              if bump_levels[level] > bump_levels[bump]:
                  bump = level

          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new_version={new_version}\n")
          EOF

      - name: Update pom.xml
        run: |
          # Find the version line after PartyDJ artifactId and replace it
          sed -i '/<artifactId>PartyDJ<\/artifactId>/,/<\/artifactId>/{s/<version>[^<]*<\/version>/<version>${{ steps.version.outputs.new_version }}<\/version>/;}' pom.xml

      - name: Commit, Tag and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }}"
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.new_version }}"
